key: cars
name: Car Listing Photos
allowedOrigins:
  - http://localhost:3000
  - https://cardealer.peterilles.com # home k3s (Cloudflare → Traefik)

limits:
  maxUploadBytes: 524288000          # 500 MB
  maxDurationSec: 180
  minDurationSec: 5
  minShortSidePx: 480
  maxCandidateFrames: 300
  ratePerIpPerHour: 10
  maxPixels: 8912896                 # 4096x2176; rejects decode bombs (RESOLUTION_TOO_HIGH)
  maxFps: 120

model:
  name: gemini-3.5-flash-lite
  temperature: 0                     # the scene list varied run to run at 0.2 (6-8 scenes, different views)
  # No reasoning for the cheap call. gemini-3.5-flash-lite rejects thinkingBudget: 0;
  # when switching to gemini-3.8-flash use `thinkingBudget: 0` instead (it rejects minimal).
  thinkingLevel: minimal
  previewHeight: 480
  previewFps: 2
  maxOutputTokens: 4096

gate:
  subject: >-
    a single passenger vehicle (car, SUV, van or pickup) being shown or walked around,
    as for a sales listing
  minConfidence: 0.6
  instructions: |
    Pass if the main subject throughout most of the video is one vehicle, filmed from
    outside and/or inside, stationary or slowly moving, in a lot, garage, street or studio.
    Fail if: the video is mainly people, scenery, a house or room, a motorcycle or bicycle,
    a racing or driving clip where the car is not the subject being presented, a screen
    recording, or if multiple different vehicles are shown with no clear single subject.

shots:
  - id: front_three_quarter
    label: Front 3/4
    required: true
    description: Front and one side visible at roughly 45°, whole car in frame; this is the hero shot
  - id: side_profile
    label: Side profile
    required: true
    description: Full side of the car, perpendicular, wheels and roofline fully visible
  - id: rear_three_quarter
    label: Rear 3/4
    required: true
    description: Rear and one side at roughly 45°, whole car in frame
  - id: interior_dashboard
    label: Dashboard
    required: true
    description: Driver's seat view of dashboard, steering wheel and center console
  - id: front
    label: Front
    description: Straight-on front showing grille, headlights and badge
  - id: rear
    label: Rear
    description: Straight-on rear showing tail lights, badge and bumper
  - id: interior_front_seats
    label: Front seats
    description: Front seats and upholstery from an open door
  - id: interior_rear_seats
    label: Rear seats
    description: Rear bench and legroom
  - id: odometer
    label: Odometer
    description: Instrument cluster with mileage readable, screen lit
  - id: wheel
    label: Wheel & tyre
    description: Close-up of one wheel showing rim and tyre condition
  - id: engine_bay
    label: Engine bay
    description: Open hood showing the engine
  - id: trunk
    label: Trunk / boot
    description: Open trunk showing cargo space
  - id: detail
    label: Detail
    description: Badges, headlights, infotainment screen or other notable detail

selection:
  imageCount: 8
  maxScenes: 30                      # analyze (up to 2 per shot) plus the located seconds
  sampleFps: 4
  scenePaddingSec: 0.5               # the locate pass covers the timestamps' slack; 1 s doubled the 4K decode time
  maxPerShot: 1                      # one photo per angle: no near-identical views
  dedupeMaxHamming: 6
  weights:
    relevance: 0.5
    sharpness: 0.4
    exposure: 0.1
  instructions: |
    You are selecting moments for a used-car sales listing, where every photo must look
    professional. Only choose moments where the WHOLE car is inside the frame for
    exterior shots — never a half car, a car cut off by the frame edge, or a close-up
    that hides the shape of the car — and where the whole area is visible for interior
    shots. Prefer moments where the camera is steady and level, nothing blocks the view
    (no people, hands, fingers or door frames in front of the car), and the lighting shows
    the paint and condition honestly. Avoid heavy motion blur, strong glare on windows or
    paint, and moments while the camera is turning between positions. Every scene must
    show a DIFFERENT angle or part of the car: never return two scenes of the same view.
    If the video has both exterior and interior footage, include both. Only fill shots you
    can actually see; do not guess. The camera may have been rotated while filming (the
    picture can be sideways); judge the content, not the orientation.

# Contact-sheet pass (internal/pipeline/locate): the preview at 1 fps, time-stamped, in
# one model call; the seconds it names become scenes next to the analyze call's. On the
# reference walkaround the analyze call put the side profile at 4-7 s while the car was
# only whole in frame from 6.5 s to 10.5 s.
locate:
  enabled: true
  fps: 1
  maxPerShot: 4
  instructions: |
    Exterior views count as shown well only when the ENTIRE car — both bumpers, all
    wheels on that side and the roof — is inside the tile with some space around it.
    A tile where the car touches or crosses the tile edge is not shown well, however
    sharp it is. The photographer's shadow on the ground is fine. For interior and
    detail views the whole feature (dashboard, seats, cluster, wheel, trunk) must be
    inside the tile. A straight-on view of the back of the car with the tailgate open
    is rear when the whole car is visible; trunk is the cargo area filling the tile.

review:
  enabled: true
  candidatesPerShot: 4               # spread over the shot's scenes (review.shortlistGap)
  minQuality: 3
  maxImageSide: 512
  instructions: |
    These are still frames for a used-car sales listing; judge each as a listing photo.
    Exterior views (front, rear, side, 3/4 angles): subjectFullyVisible is true only if
    the ENTIRE car — both bumpers, all wheels on that side and the roof — is inside the
    image with some space around it; a car cut off by any image edge is not fully
    visible. Interior and detail views: the whole feature (dashboard, seats, trunk,
    engine bay, wheel, odometer) must be inside the image. The box must tightly enclose
    the car (exterior) or the feature (interior/detail), not the whole image. Quality 5
    is a photo a dealer would publish as is; 3 is acceptable; 1-2 means blurry, dark,
    blown out, obstructed (people, hands, fingers), strongly tilted or not showing the
    view at all. Report the view an image MAINLY shows: a picture of the whole dashboard
    and steering wheel is interior_dashboard even if the gauges are visible (odometer only
    when the instrument cluster fills most of the picture), and a wheel close-up is wheel,
    not a side view. A straight-on view of the back of the car with the tailgate open
    is still rear when the whole car is in the picture; trunk is only when the cargo
    area fills most of the picture. The photographer's shadow on the ground or their
    reflection in the paint is normal for a walkaround and not a defect. Mark
    near-duplicates with sameAs: the listing must never show the same view twice.

crop:
  enabled: true
  aspect: "4:3"                      # standard listing photo; upright portrait frames become landscape
  marginPct: 10                      # the review box runs tight; 6 % put the car on the photo edge
  minMarginPct: 3                    # below this the frame stays uncropped (studio needs room around the car)
  # Smallest short side of a cropped photo that keeps the frame's orientation (a 4K
  # landscape frame crops to at least 1440x1080). Portrait frames turn landscape anyway:
  # crop.Plan lowers the floor for them to their widest 4:3 crop (1080p: 1080x810,
  # 720p: 720x540), but not below 480 px.
  minShortSidePx: 1080
  # A straight-on front or rear in an upright portrait frame fills it top to bottom, so
  # no 4:3 crop fits; a portrait crop keeps the subject framed instead of no crop.
  fallbackAspect: "3:4"

# Studio backgrounds for exterior photos (internal/studio): the car is cut out and put on
# a studio backdrop; car pixels stay the original pixels (no retouching), and the original
# photo always stays available. Runs after the job completed, only on a worker with the
# segmentation sidecar (V2I_STUDIO_URL).
studio:
  enabled: true
  # Every exterior shot: the gates and the QA check withhold a bad cut-out (an open
  # tailgate and see-through glass are the usual reasons), the original always stays.
  views: [front_three_quarter, side_profile, rear_three_quarter, front, rear, trunk, wheel, engine_bay, detail]
  styles: [grey, light, dark]        # drawn backdrops in display order; dark is never the default (black cars merge)
  qa: true                           # model check: any missing car part withholds the studio version
  # The "studio" style: an image model paints a photo studio (turntable, cyclorama)
  # around the cut-out car; the car pixels stay the originals. It is the default style.
  # Interiors get the same studio through the windows (only what the model changed is
  # taken, the cabin stays pixel for pixel). ~$0.07 per photo.
  generative:
    enabled: true
    model: gemini-3.1-flash-image
    look: grey
    pad: 0.25
    keepPad: 0.10
    interiorViews: [interior_dashboard, interior_front_seats, interior_rear_seats]

retentionHours: 24

copy:
  uploadTitle: Upload a walkaround video of the car
  # The page adds the accepted formats and the effective size limit.
  uploadHint: 30–120 seconds. Walk slowly around the outside, then film the interior.
  rejectedTitle: This doesn't look like a car video
