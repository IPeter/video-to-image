# Local development dependencies: Postgres (jobs + River queue) and MinIO (S3-compatible
# storage). The Go binary and the Next.js app run on the host (see README.md).
# MinIO images come from quay.io (Docker Hub minio/* images are no longer published).
# Host ports are offset (55432, 59000/59001) to avoid clashing with a local Postgres/MinIO.
name: v2i

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: v2i
      POSTGRES_PASSWORD: v2i
      POSTGRES_DB: v2i
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2i -d v2i"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: v2i-minio
      MINIO_ROOT_PASSWORD: v2i-minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the bucket once MinIO is up, with a 3-day lifecycle rule as a safety net
  # (retention is enforced by the app; this only catches leaks).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 v2i-minio v2i-minio-secret &&
      mc mb --ignore-existing local/v2i &&
      mc ilm rule add --expire-days 3 local/v2i || true
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
