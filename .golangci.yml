version: "2"
run:
  timeout: 5m
linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      # Closing/removing on cleanup paths: the error is either irrelevant (read-only
      # file, best-effort temp removal) or already reported by the primary operation.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - os.Remove
        - os.RemoveAll
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck with the exclusions above
        - G115 # integer conversions: dHash uint64<->int64 bit reinterpretation and ZIP DOS dates are intentional and range-checked
        - G204 # subprocess with variable args: ffmpeg/ffprobe invocations are intentional (no shell)
        - G301 # 0755 directories: scratch/storage dirs are shared with the container user by design
        - G302 # 0644 files: recordings and exports are meant to be readable
        - G304 # file inclusion via variable: paths are generated by the app
        - G306 # 0644 WriteFile: generated artefacts (openapi.json) are meant to be readable
        - G404 # math/rand: only used for retry jitter, never for secrets or IDs
  exclusions:
    generated: strict
    paths:
      - internal/store/sqlcdb
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
