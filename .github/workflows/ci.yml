name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2i
          POSTGRES_PASSWORD: v2i
          POSTGRES_DB: v2i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U v2i -d v2i" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      V2I_TEST_DATABASE_URL: postgres://v2i:v2i@localhost:5432/v2i?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: go test
        run: go test -race -count=1 ./...
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc drift
        run: sqlc diff
      - name: OpenAPI drift
        run: |
          go run ./cmd/v2i openapi -o api/openapi.json
          git diff --exit-code api/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API type drift (web/lib/api.d.ts vs api/openapi.json)
        run: |
          pnpm gen:api
          git diff --exit-code lib/api.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No page may be prerendered (runtime DOMAIN_KEY/API_URL, decision 13)
        run: pnpm check:dynamic

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2i
          POSTGRES_PASSWORD: v2i
          POSTGRES_DB: v2i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U v2i -d v2i" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://v2i:v2i@localhost:5432/v2i?sslmode=disable
      V2I_LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: ./scripts/gen-fixtures.sh
      - run: go build -o bin/v2i ./cmd/v2i && ./bin/v2i migrate
      - name: Start API with embedded worker and fake analyzer
        env:
          # The runner context is only available at step level.
          V2I_STORAGE_DIR: ${{ runner.temp }}/storage
          V2I_SCRATCH_DIR: ${{ runner.temp }}/scratch
        run: |
          ./bin/v2i serve --embed-worker --analyzer=fake > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS localhost:4000/healthz; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy" >&2
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          # Production standalone build (what the container runs); CI=true makes the
          # specs fail instead of skipping when the API or fixtures are missing.
          pnpm test:e2e:prod
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.v2i
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/v2i:sha-${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/v2i:main
          cache-from: type=gha,scope=v2i
          cache-to: type=gha,mode=max,scope=v2i
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: deploy/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/web:sha-${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
