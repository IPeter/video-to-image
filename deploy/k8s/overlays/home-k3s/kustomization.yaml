# Home k3s cluster: https://cardealer.peterilles.com (Cloudflare proxy → Traefik :80).
# Deploy with deploy/k8s/deploy.sh (builds, loads images onto the node, applies this).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2i
resources:
  - ../../base
  - ingress.yaml
  - basic-auth.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: v2i-env
    envs: [config.env]
secretGenerator:
  # Generated by deploy.sh on first run; git-ignored (see secrets.env.example).
  - name: v2i-secrets
    envs: [secrets.env]
  - name: v2i-gemini
    envs: [gemini.env]
  # htpasswd lines for Traefik's basicAuth; fixed name because the Middleware refers
  # to it by name (kustomize would not rewrite that reference).
  - name: v2i-basic-auth
    files: [users=basic-auth.users]
    options:
      disableNameSuffixHash: true
patches:
  - target: { kind: Deployment, name: web-cars }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://cardealer.peterilles.com
# Images are imported straight into the node's containerd (no registry); deploy.sh
# rewrites the tags. The default pull policy for a non-latest tag is IfNotPresent.
images:
  - name: v2i
    newName: localhost/v2i
    newTag: c3d6792-20260923175233
  - name: v2i-web
    newName: localhost/v2i-web
    newTag: c3d6792-20260923175233
