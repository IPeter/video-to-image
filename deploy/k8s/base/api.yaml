apiVersion: v1
kind: Service
metadata:
  name: v2i-api
  labels:
    app.kubernetes.io/name: v2i-api
spec:
  selector:
    app.kubernetes.io/name: v2i-api
  ports:
    - name: http
      port: 4000
      targetPort: http
    - name: admin
      port: 4001
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v2i-api
  labels:
    app.kubernetes.io/name: v2i-api
spec:
  replicas: 1 # in-memory rate limits: keep one replica (plan/02)
  selector:
    matchLabels:
      app.kubernetes.io/name: v2i-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: v2i-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Idempotent and serialised by an advisory lock (safe next to the worker's).
        - name: migrate
          image: v2i
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: v2i-env }
            - secretRef: { name: v2i-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: api
          image: v2i
          args: ["serve"]
          ports:
            - { name: http, containerPort: 4000 }
            - { name: admin, containerPort: 4001 }
          envFrom:
            - configMapRef: { name: v2i-env }
            - secretRef: { name: v2i-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: domains, mountPath: /etc/v2i/domains, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: scratch, mountPath: /scratch }
            - { name: tmp, mountPath: /tmp }
      terminationGracePeriodSeconds: 40
      volumes:
        - name: domains
          configMap: { name: v2i-domains }
        - name: data
          persistentVolumeClaim: { claimName: v2i-data }
        - name: scratch # upload spool + chunked sessions: V2I_MAX_CONCURRENT_UPLOADS × maxUploadBytes
          emptyDir: { sizeLimit: 3Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
